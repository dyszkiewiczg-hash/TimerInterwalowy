
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz pliki projektu
        uses: actions/checkout@v4

      - name: Ustaw Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Zainstaluj Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Nie znaleziono sdkmanager w Android SDK."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj aplikację
        run: gradle assembleDebug

      - name: Udostępnij plik APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TimerInterwalowy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
